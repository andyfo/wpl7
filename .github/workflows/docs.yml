# The documentation site (docs/site, published at https://wpl7.com/docs/).
#
# Jobs, and what each is for:
#   changes      which parts of the repository a run touches, for the jobs below to decide on
#   build        a pull request that changes the site builds, with every internal link checked
#   check        the generated pages match their sources, and every page and @docs marker maps
#   screenshots  a pull request that changes the panel's look gets its screenshots retaken
#   package      main, a release or a manual run: the site built, zipped, and installed once as the
#                website's plugin would
#   publish      the zip goes on the `docs-site` release, where the website's plugin fetches it
#
# The `docs-sync` check has a workflow of its own, docs-sync.yml. A release starts `package` and
# `publish` from release.yml. docs/site/README.md is the contributor side of all of this.
name: Docs

on:
  pull_request:
  push:
    branches: [main]
  # Also how release.yml starts a publish once a release is out.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the site: build it and put it on the docs-site release (from main only)'
        type: boolean
        default: true
      screenshots:
        description: 'Retake every screenshot and open a pull request with them'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # One diff for every job, so they cannot disagree about what a run changed. A manual run has
  # no diff: it counts as changing everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ steps.diff.outputs.site }}
      screens: ${{ steps.diff.outputs.screens }}
      files: ${{ steps.diff.outputs.files }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) files="$(git diff --name-only "$PR_BASE"...HEAD)" ;;
            # A push that created the branch has no "before"; treat it as changing everything.
            push) if git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                    files="$(git diff --name-only "$PUSH_BEFORE" HEAD)"
                  else files='*'; fi ;;
            *) files='*' ;;
          esac
          {
            if [ "$files" = '*' ] || grep -q '^docs/site/' <<<"$files"; then echo site=true; else echo site=false; fi
            # What the screenshots show: the web app, the strings it takes from panel/shared, the
            # demo world and its fakes, and the shot list.
            if grep -Eq '^(panel/web/|panel/shared/|panel/scripts/demo|panel/test/helpers\.ts$|docs/site/scripts/(shoot|shots|compare-shots)\.ts$)' <<<"$files"
            then echo screens=true; else echo screens=false; fi
            echo 'files<<EOF'
            echo "$files"
            echo EOF
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build the docs
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # "Last updated" on every page comes from each file's git history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
        working-directory: docs/site
      # The generated pages are committed; the `check` job holds them to their sources. The
      # build fails on a broken internal link or anchor (starlight-links-validator).
      - run: npm run build
        working-directory: docs/site
        env:
          DOCS_BUILD_ID: ${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docs/site/dist
          retention-days: 7

  # The generated pages (the API reference, MCP tools, deploy/.env, job types, levels and the
  # changelog) are committed. This writes them again from their sources and fails on any
  # difference, so a change to panel/shared/apiDocs.ts cannot merge without its pages. Then
  # docs:map holds every page and @docs marker to its rules.
  check:
    name: Generated pages and the docs map
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The generators import panel modules: the API catalog, the MCP tools, the job types.
      - uses: ./.github/actions/panel-deps
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
        working-directory: docs/site
      # From the committed releases.json: refreshing it from GitHub is the publishing side's.
      - run: npm run docs:generate
        working-directory: docs/site
      # git status rather than git diff alone: a page the generators add or remove counts too.
      - name: The generated pages match their sources
        run: |
          if [ -n "$(git status --porcelain -- docs/site/src/content/docs)" ]; then
            git status --short -- docs/site/src/content/docs
            git --no-pager diff -- docs/site/src/content/docs
            echo "::error::The generated docs pages differ from their sources. Run npm run docs:generate in docs/site and commit the result."
            exit 1
          fi
      - run: npm run docs:map
        working-directory: docs/site

  # The screenshots in docs/site/screens follow the panel's look. On a pull request that changes
  # it, this takes every shot again (docs/site/scripts/shoot.ts, from the demo world) in the
  # Playwright image pinned to the package's version, so two runs of the same code give the same
  # bytes. A capture that differs in more than 0.1 % of its pixels replaces the committed file;
  # the rest stay as they are. A branch of this repository gets the new files pushed to it as
  # "Update docs screenshots", a fork's pull request gets them as an artifact. By hand
  # (screenshots: true) it retakes everything onto a branch of its own and opens a pull request.
  #
  # A push or a pull request made with the workflow's own token starts no workflow, so neither
  # gets its checks until something else pushes. A fine-grained token with read and write access
  # to this repository's contents and pull requests, as the secret SCREENSHOTS_PUSH_TOKEN, makes
  # them run.
  screenshots:
    name: Screenshots
    needs: changes
    if: >-
      (github.event_name == 'pull_request' && needs.changes.outputs.screens == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.screenshots)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    # In a container, `run` steps default to sh.
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      pull-requests: write
    env:
      SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request's branch itself, so the new files can go on top of it.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
          token: ${{ secrets.SCREENSHOTS_PUSH_TOKEN || github.token }}
      # The container runs as root and the checkout belongs to the runner's user. Git refuses a
      # folder someone else owns ("not in a git directory") unless it is marked safe, and
      # actions/checkout marks it for its own step only.
      - name: Let git use the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The image has no compiler, and better-sqlite3 compiles during the panel's npm ci (as in
      # panel/Dockerfile). Nor has it the GitHub CLI, which opens the manual run's pull request.
      - name: Build tools and the GitHub CLI
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends make g++ gh > /dev/null
      # Ubuntu has no oxipng package. The upstream release, pinned by version and checksum like
      # the image (docs/internal/watchlist.md).
      - name: oxipng
        env:
          OXIPNG_VERSION: 10.2.1
          OXIPNG_SHA256: 46e3c4beb9aae57290ad809dd3374b07153579d3322a3778c53900633618b7c6
        run: |
          name="oxipng-$OXIPNG_VERSION-x86_64-unknown-linux-gnu"
          curl -fsSL -o "$RUNNER_TEMP/oxipng.tar.gz" \
            "https://github.com/shssoichiro/oxipng/releases/download/v$OXIPNG_VERSION/$name.tar.gz"
          echo "$OXIPNG_SHA256  $RUNNER_TEMP/oxipng.tar.gz" | sha256sum -c --quiet
          tar -xzf "$RUNNER_TEMP/oxipng.tar.gz" -C "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/$name/oxipng" /usr/local/bin/oxipng
          oxipng --version
      # Inside the image, not from the runner's cache: the panel's native modules are built for
      # the system that runs them.
      - run: npm ci
        working-directory: panel
      - run: npm ci
        working-directory: docs/site
      - name: Take the screenshots
        working-directory: docs/site
        run: |
          mkdir -p screens
          cp -R screens "$RUNNER_TEMP/screens-before"
          rm -rf screens
          npm run shoot
          npx tsx scripts/compare-shots.ts --before "$RUNNER_TEMP/screens-before" --report "$RUNNER_TEMP/screens.md"
          cat "$RUNNER_TEMP/screens.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Push them to the pull request
        if: github.event_name == 'pull_request' && env.SAME_REPO == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/site/screens
          if git diff --cached --quiet; then echo 'No screenshot changed.'; exit 0; fi
          git commit -q -m 'Update docs screenshots'
          git push origin "HEAD:$GITHUB_HEAD_REF"
      - name: Hand them to the fork's author
        if: github.event_name == 'pull_request' && env.SAME_REPO != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: docs-screenshots
          path: docs/site/screens
          retention-days: 14
      - name: Open a pull request with them
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.SCREENSHOTS_PUSH_TOKEN || github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/site/screens
          if git diff --cached --quiet; then echo 'No screenshot changed.'; exit 0; fi
          branch="docs/screenshots-$GITHUB_RUN_ID"
          git switch -q -c "$branch"
          git commit -q -m 'Update docs screenshots'
          git push -q origin "$branch"
          # The workflow's own token may only open it when the repository allows GitHub Actions to
          # create pull requests (Settings → Actions → General); the push token needs no setting.
          gh pr create --base main --head "$branch" --label docs \
            --title 'Update the docs screenshots' \
            --body-file "$RUNNER_TEMP/screens.md" || {
            echo "::error::Pushed $branch but could not open its pull request. Open it by hand: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
            exit 1
          }

  # The site, built and zipped for the website to install: on every merge to main that changes the
  # docs or the code they document, after every release, and by hand. A release creates its
  # GitHub release with the workflow's own token, which starts no workflow, so release.yml runs
  # this one by hand once the release is out; the Edge badges of what it ships then fall away.
  # The zip is installed once here with the website's own plugin (docs/site/hosting/wpl7-docs.php),
  # so a zip the website would refuse fails this job instead.
  package:
    name: Build and zip the site
    needs: changes
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.relevant.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
        working-directory: docs/site
      # A merge publishes when it changed the site or a file one of its pages documents.
      - name: Does this change the docs?
        id: relevant
        working-directory: docs/site
        env:
          EVENT: ${{ github.event_name }}
          FILES: ${{ needs.changes.outputs.files }}
        run: |
          if [ "$EVENT" != push ] || [ "$FILES" = '*' ]; then echo publish=true >> "$GITHUB_OUTPUT"; exit 0; fi
          npm run --silent docs:map > /dev/null || true
          node -e '
            const map = require("./.docs-map.json");
            const files = process.env.FILES.split("\n").filter(Boolean);
            const hit = files.find((f) => f.startsWith("docs/site/") || map.files[f]);
            console.log(hit ? `publish=true` : `publish=false`);
            if (hit) console.error(`Publishing: ${hit} changed.`); else console.error("Nothing the docs show changed.");
          ' >> "$GITHUB_OUTPUT"
      - name: Refresh the release notes
        if: steps.relevant.outputs.publish == 'true'
        working-directory: docs/site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run docs:releases
          npm run docs:generate -- --only changelog
      - name: Build
        if: steps.relevant.outputs.publish == 'true'
        working-directory: docs/site
        env:
          DOCS_BUILD_ID: ${{ github.sha }}
        run: npm run build
      # wpl7-docs.json names the zip, with its size and SHA-256. Every build's zip has a name of its
      # own, so a website that read the previous json still finds the zip it names.
      - name: Zip it
        if: steps.relevant.outputs.publish == 'true'
        working-directory: docs/site/dist
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/package"
          zip="wpl7-docs-${GITHUB_SHA:0:7}-$GITHUB_RUN_NUMBER.zip"
          mkdir -p "$out"
          zip -q -r -X "$out/$zip" .
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg zip "$zip" \
            --argjson size "$(stat -c %s "$out/$zip")" \
            --arg sha256 "$(sha256sum "$out/$zip" | cut -d ' ' -f 1)" \
            '{commit: $commit, builtAt: $builtAt, zip: $zip, size: $size, sha256: $sha256}' > "$out/wpl7-docs.json"
          cat "$out/wpl7-docs.json"
      - name: Install it as the website would
        if: steps.relevant.outputs.publish == 'true'
        working-directory: docs/site
        run: |
          set -euo pipefail
          # GitHub's Ubuntu runner comes with PHP and its zip extension, but does not promise them.
          if ! php -m 2> /dev/null | grep -qx zip; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends php-cli php-zip > /dev/null
          fi
          mkdir -p "$RUNNER_TEMP/website"
          php -r '
            define("ABSPATH", $argv[1] . "/");
            require "hosting/wpl7-docs.php";
            $build = json_decode(file_get_contents($argv[2] . "/wpl7-docs.json"), true);
            echo WPL7_Docs::install($argv[2] . "/" . $build["zip"], $build), " files installed\n";
          ' "$RUNNER_TEMP/website" "$RUNNER_TEMP/package"
          test -f "$RUNNER_TEMP/website/docs/index.html"
          test -f "$RUNNER_TEMP/website/docs/.htaccess"
      - if: steps.relevant.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: docs-package
          path: ${{ runner.temp }}/package
          retention-days: 3

  # Attaches the zip to the `docs-site` release, where websites fetch it (docs/site/hosting/README.md).
  # The only job here that may write to the repository, and it runs nothing from npm. The release is
  # made once and stays: its assets are replaced, so it sinks down the releases list as versions
  # come out.
  publish:
    name: Publish
    needs: package
    if: needs.package.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # One publish at a time, and never one cut off half-way.
    concurrency:
      group: docs-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: docs-site
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docs-package
          path: package
      - name: Attach it to the docs-site release
        id: attach
        run: |
          set -euo pipefail
          zip="$(jq -r .zip package/wpl7-docs.json)"
          previous=''
          if gh release download "$TAG" --repo "$REPO" --pattern wpl7-docs.json --dir current 2> /dev/null; then
            previous="$(jq -r '.zip // empty' current/wpl7-docs.json)"
            published="$(jq -r '.commit // empty' current/wpl7-docs.json)"
            # Two merges close together can finish out of order: an older build never replaces a newer one.
            if [ -n "$published" ] && [ "$(gh api "repos/$REPO/compare/$published...$GITHUB_SHA" --jq .status 2> /dev/null)" = behind ]; then
              echo "::notice::Not published: the release has the docs of ${published:0:7}, which is newer."
              echo attached=false >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --prerelease --target "$GITHUB_SHA" --title 'Docs site' \
              --notes 'The documentation site, for the website to install: `wpl7-docs.json` names the current zip. Replaced with every change to the docs; not a version of WPL7. See `docs/site/hosting/README.md`.'
          fi
          # The zip first, then the json that names it. A rerun of this job uploads the same zip again.
          gh release upload "$TAG" "package/$zip" --repo "$REPO" --clobber
          gh release upload "$TAG" package/wpl7-docs.json --repo "$REPO" --clobber
          # Older zips go. The one the previous json named stays: a website may be downloading it.
          for name in $(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name'); do
            case "$name" in
              "$zip" | "$previous" | wpl7-docs.json) ;;
              wpl7-docs-*.zip) gh release delete-asset "$TAG" "$name" --repo "$REPO" --yes ;;
            esac
          done
          echo attached=true >> "$GITHUB_OUTPUT"
      # What a website fetches: the json at the public address names this build, and its zip answers.
      - name: Check the public address
        if: steps.attach.outputs.attached == 'true'
        run: |
          set -euo pipefail
          base="https://github.com/$REPO/releases/download/$TAG"
          zip="$(jq -r .zip package/wpl7-docs.json)"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "$base/wpl7-docs.json" | jq -e --arg sha "$GITHUB_SHA" '.commit == $sha' > /dev/null; then break; fi
            [ "$attempt" = 6 ] && { echo "::error::$base/wpl7-docs.json does not name build ${GITHUB_SHA:0:7}"; exit 1; }
            sleep 10
          done
          curl -fsSL -o /dev/null "$base/$zip"
          {
            echo '### Docs published'
            echo "\`$zip\` ($(du -h "package/$zip" | cut -f 1)) is on the [\`$TAG\` release]($GITHUB_SERVER_URL/$REPO/releases/tag/$TAG)."
            echo 'A website with the docs plugin installs it at its next `wp wpl7-docs update`.'
          } >> "$GITHUB_STEP_SUMMARY"
