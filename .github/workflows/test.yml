# The gate every other workflow goes through. Extracted so a release and a merge to main
# cannot drift into testing different things.
name: Test

on:
  workflow_call:

permissions:
  contents: read

# Split in two so the gate answers at the speed of its slowest half, not their sum: typecheck
# and build are seconds of work and should not report a type error from behind the suite.
jobs:
  test:
    name: Unit + API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/panel-deps
      - run: npm test
        working-directory: panel

  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/panel-deps
      - run: npm run typecheck
        working-directory: panel
      # The panel image runs this same build. Catching a broken bundle here means no box
      # ever gets as far as replacing a working container with a broken one.
      - run: npm run build
        working-directory: panel

  # The two WordPress plugins, WPL7 Migrate (imports) and WPL7 Connect (sites hosted elsewhere),
  # run on the site's own PHP, which can be as old as 7.0, so they are linted and checked against
  # their protocols' vectors at both ends of what they support. PHP 7.0 has no sodium: there
  # Connect's Ed25519 checks run on sodium_compat, as WordPress bundles it, installed with Composer
  # into a scratch folder. The floors and the action that installs PHP 7.0 are on
  # docs/internal/watchlist.md.
  php:
    name: WordPress plugins, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.0', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - name: Lint every PHP file
        run: find panel/migrate-plugin panel/connect-plugin -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Check the import protocol's vectors
        run: php panel/migrate-plugin/tests/run.php
      - name: Install sodium_compat for a PHP without sodium
        if: matrix.php == '7.0'
        run: |
          mkdir -p "$RUNNER_TEMP/sodium"
          composer require --working-dir="$RUNNER_TEMP/sodium" --no-interaction --no-progress paragonie/sodium_compat
          echo "WPL7_SODIUM_COMPAT=$RUNNER_TEMP/sodium/vendor/autoload.php" >> "$GITHUB_ENV"
      - name: Check the connect protocol's vectors
        run: php panel/connect-plugin/tests/run.php

  # What a pull request's run tested, by tree - the merge result it checked out. A squash merge
  # made while main stood still lands exactly this tree on main, and deploy.yml builds that
  # without testing it a second time.
  mark:
    name: Mark the tested tree
    needs: [test, check, php]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - id: tree
        run: |
          echo "sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > tested-commit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: tested-tree-${{ steps.tree.outputs.sha }}
          path: tested-commit.txt
          retention-days: 7
          overwrite: true
