name: Panel dependencies
description: Put panel/node_modules in place, from cache whenever the lockfile has not moved.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 22

    # node_modules itself, not ~/.npm: better-sqlite3 and argon2 are compiled during install,
    # so the key carries the platform they were compiled for alongside the lockfile. setup-node's
    # own npm cache is deliberately left off - it would be restored on every run to save a cold
    # download on the rare one where the lockfile actually changed.
    - id: cache
      uses: actions/cache@v4
      with:
        path: panel/node_modules
        key: panel-node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('panel/package-lock.json') }}

    - if: steps.cache.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash
      working-directory: panel
