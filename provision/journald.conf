# @docs reference/installer-and-scripts, servers/resources
# provision/setup.sh copies this to /etc/systemd/journald.conf.d/wpl7.conf.
#
# systemd lets the journal grow to a tenth of the disk, up to 4 GB, and a server that SSH bots try
# all day gets there. To keep more, add a drop-in of your own that sorts after this one, such as
# zz-local.conf: of two that set the same option, the last one read wins.
[Journal]
SystemMaxUse=500M
