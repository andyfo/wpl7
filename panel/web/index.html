<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#131418" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>WPL7</title>
    <script>
      // Apply before first paint, including on the sign-in page.
      (() => {
        let accent = 'blue';
        try { accent = localStorage.getItem('wpl7-accent') || 'blue'; } catch {}
        document.documentElement.dataset.accent = ['blue', 'violet', 'rose', 'amber', 'graphite', 'yellow', 'green'].includes(accent) ? accent : 'blue';
        let theme = 'system';
        try { theme = localStorage.getItem('wpl7-theme') || 'system'; } catch {}
        document.documentElement.dataset.theme = theme === 'light' || theme === 'dark'
          ? theme : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
