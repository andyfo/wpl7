# Overlay: adds the `letsencrypt-dns` ACME resolver (DNS-01) so dev sites share one
# wildcard cert for *.${DEV_DOMAIN}, plus its staging twin so ACME_RESOLVER=letsencrypt-staging
# really does keep every request off the production CA.
# Requires DNS_PROVIDER + provider credentials in .env.
#   docker compose -f docker-compose.yml -f docker-compose.dns.yml up -d
# NOTE: `command:` lists replace wholesale on merge, so the full Traefik command is repeated here
# - every flag of the base file, then the resolvers only this overlay adds. A flag missing here
# is missing on every server with a DNS provider: the access log once was, and those servers
# had no visitor statistics and nothing for the panel's attack detection to read.
# panel/test/unit/composeFlags.test.ts fails when the two lists drift apart.
services:
  traefik:
    command:
      - "--log.level=INFO"
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=wpl7_proxy"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.fields.headers.defaultmode=drop"
      - "--accesslog.fields.headers.names.User-Agent=keep"
      - "--accesslog.fields.headers.names.Referer=keep"
      - "--accesslog.fields.headers.names.Cf-Connecting-Ip=keep"
      - "--accesslog.fields.headers.names.True-Client-Ip=keep"
      - "--accesslog.fields.headers.names.Fastly-Client-Ip=keep"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt-staging.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt-staging.acme.storage=/letsencrypt/acme-staging.json"
      - "--certificatesresolvers.letsencrypt-staging.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
      - "--certificatesresolvers.letsencrypt-staging.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt-dns.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt-dns.acme.storage=/letsencrypt/acme-dns.json"
      - "--certificatesresolvers.letsencrypt-dns.acme.dnschallenge.provider=${DNS_PROVIDER}"
      - "--certificatesresolvers.letsencrypt-dns.acme.dnschallenge.propagation.delayBeforeChecks=30s"
      - "--certificatesresolvers.letsencrypt-dns-staging.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt-dns-staging.acme.storage=/letsencrypt/acme-dns-staging.json"
      - "--certificatesresolvers.letsencrypt-dns-staging.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
      - "--certificatesresolvers.letsencrypt-dns-staging.acme.dnschallenge.provider=${DNS_PROVIDER}"
      - "--certificatesresolvers.letsencrypt-dns-staging.acme.dnschallenge.propagation.delayBeforeChecks=30s"
    environment:
      # lego reads provider credentials from the process environment. Add the variable(s)
      # your provider needs (https://doc.traefik.io/traefik/https/acme/#providers).
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}
      HETZNER_API_KEY: ${HETZNER_API_KEY:-}
      DO_AUTH_TOKEN: ${DO_AUTH_TOKEN:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
