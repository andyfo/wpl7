# The site with the page cache off, used when the panel's file is missing or nginx refuses it: a
# broken cache setting must not take a site down. Everything goes straight to Apache, and answers
# come back unbuffered, so streamed answers and downloads behave as they do without nginx.
# Installed as /etc/nginx/wpl7-passthrough.conf.

server {
    listen 8080 default_server;
    server_name _;

    location / {
        proxy_buffering off;
        # Apache alone ignored these, and PHP may send them. To nginx they would mean something.
        proxy_ignore_headers X-Accel-Redirect X-Accel-Limit-Rate X-Accel-Charset;

        add_header X-Cache-Status BYPASS always;
        add_header X-Cache-Skipped off always;

        proxy_pass http://apache;
    }
}
