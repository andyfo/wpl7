; The site's PHP-FPM pool, read after the official image's files, whose [www] it adds to. The sizes
; here are a default: a [www] section the panel writes (/etc/wpl7-runtime/php-fpm-pool.conf) is
; copied in after this file, once PHP-FPM has accepted it. Installed as php-fpm.d/zz-wpl7.conf.

[global]
; wpl7-reload finds the master here. Not under /run/wpl7, which the site's own user can write to.
pid = /run/php-fpm.pid
; How long a reload gives the requests in progress before it ends them. By default it gives them
; nothing. A stop ends them sooner: wpl7-start has waited for them by then, and allows a few more.
process_control_timeout = 10s
; Without this, every worker that comes and goes writes two lines to `docker logs`. PHP's own errors
; get there at any level, notices included.
log_level = warning

[www]
; A socket only. The official image listens on TCP 9000, which anything on the site's network could
; reach: FastCGI has no authentication, and its parameters can set PHP's settings.
listen = /run/wpl7/php-fpm.sock
; Apache's workers run as www-data and connect through the group. The socket stays root's, so that
; the site's own user can't remove it from /run/wpl7 (a sticky folder, see wpl7-start).
listen.owner = root
listen.group = www-data
listen.mode = 0660

user = www-data
group = www-data

; One worker stays ready, and more start each second while none is idle. Not ondemand: it starts a
; worker when a request arrives, so of two arriving together the second waits for the first to end
; however long that takes, unless a third comes. Two 4 s requests took 8 s. An idle worker costs a
; site about 10 MB.
pm = dynamic
pm.max_children = 10
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500
; mod_php had no wall clock, because max_execution_time doesn't count waiting. A worker that hangs
; has to end some day here, since a pool has only a few: an hour lets backups and big downloads
; through PHP finish, and nginx and Apache allow the same.
request_terminate_timeout = 3600s

; wp-config-docker.php reads the database settings from the environment on every request.
clear_env = no

; Only what Apache hands over anyway; a request can't get another extension run as PHP.
security.limit_extensions = .php

; So a script writing to stderr reaches `docker logs`, without FPM's wrapping around each line.
catch_workers_output = yes
decorate_workers_output = no
