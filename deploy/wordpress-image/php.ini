; Settings for every PHP in the image. Installed as conf.d/zx-wpl7.ini: after the official image's
; opcache-recommended.ini, and before what comes from outside the image. Those are the sizes the
; panel works out from the site's memory (/etc/wpl7-runtime/php.ini, linked as
; zy-wpl7-runtime.ini) and the settings an operator keeps in the site's own file (zz-site.ini),
; which win as they always have.

; The image has no php.ini, so without this PHP runs assertions, its development default.
zend.assertions = -1

; WP-CLI runs outside FPM and can't clear its OPcache after an update, so PHP checks the files
; itself, every 2 seconds as in the official image.
opcache.revalidate_freq = 2
; WordPress with a few big plugins goes past the official image's 4,000.
opcache.max_accelerated_files = 20000

; The official image's sizes, for a site with no file from the panel. They have run in every memory
; limit so far; the panel's file fits them to the site's own.
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
