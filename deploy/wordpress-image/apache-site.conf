# The site's Apache, behind nginx in the same container. It keeps what the official
# wordpress:<php>-apache image gives a site, so its .htaccess files go on working, with PHP handed
# to PHP-FPM instead of running inside Apache. Installed as conf-enabled/wpl7-site.conf.

# Not used for the sites' own names (UseCanonicalName stays off, so PHP sees the visitor's Host).
# It only quiets the warning `apache2ctl -t` would print on every check.
ServerName localhost
ServerAdmin webmaster@localhost
DocumentRoot /var/www/html

# Errors reach `docker logs`. Requests aren't logged: Traefik logs every one of them already.
ErrorLog /proc/self/fd/2

# As long as nginx and PHP-FPM allow, so the shortest of them isn't this one. mod_php had no wall
# clock at all, and backups and big downloads through PHP run for a long time.
Timeout 3600
ProxyTimeout 3600

# A process per 25 requests in progress. nginx holds anything past 75 in front of Apache, and
# PHP-FPM's pool is what caps real work, so this stays well inside a container limit of a few
# hundred processes. ServerLimit is double what the workers need, so a graceful reload can start
# new children while old ones finish their requests.
StartServers 1
ServerLimit 6
ThreadLimit 25
ThreadsPerChild 25
MinSpareThreads 10
MaxSpareThreads 40
MaxRequestWorkers 75
MaxConnectionsPerChild 0

# The official image's setting, copied: Traefik and nginx are trusted to say who the visitor is.
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 10.0.0.0/8
RemoteIPInternalProxy 172.16.0.0/12
RemoteIPInternalProxy 192.168.0.0/16
RemoteIPInternalProxy 169.254.0.0/16
RemoteIPInternalProxy 127.0.0.0/8

DirectoryIndex disabled
DirectoryIndex index.php index.html

<Directory /var/www/>
    Options -Indexes
    AllowOverride All
    # mod_php gave PHP the Authorization header by itself; FastCGI needs telling. Application
    # Passwords and the panel's REST tool depend on it.
    CGIPassAuth On
</Directory>

# flushpackets: a PHP flush() has to reach nginx, or streamed answers arrive in one piece. auto
# waits for a 10 ms pause in the output before it flushes, so a page in full flow compresses as one
# piece, not one piece per FastCGI packet.
# retry=0: by default one failed connection (a pool's backlog full for a moment) makes mod_proxy
# answer 503 to everything for the next 60 s.
# Connections aren't reused, the default kept on purpose: a reused one would hold a PHP worker for
# as long as it stayed open, and a pool has only a few.
<Proxy "fcgi://localhost" flushpackets=auto retry=0>
</Proxy>

# Apache stopped believing a Content-Length from a script, and sends such an answer chunked. mod_php
# was believed. Downloads then show no size or time left, and one that is cut short looks complete.
# nginx opens a new connection to Apache per request and takes only that many bytes, so a script
# that gets its length wrong can't confuse what comes after it.
SetEnv ap_trust_cgilike_cl 1

# nginx reaches this Apache over the loopback, so PHP would see 127.0.0.1 as the server's address,
# which plugins take for a development machine. nginx says which address the visitor reached, and
# overwrites whatever a visitor sends in its place. Asked directly, as the panel's REST tool does,
# the address stays the loopback's, which is then the truth. req_novary, or Apache would add a Vary
# for the header to every page, and nginx would store none of them.
ProxyFCGISetEnvIf "-n req_novary('X-Wpl7-Server-Addr')" SERVER_ADDR "%{req_novary:X-Wpl7-Server-Addr}"
ProxyFCGISetEnvIf "true" !HTTP_X_WPL7_SERVER_ADDR

# nginx holds the Referer back on the path that may store a page, because plugins print it into
# forms, and wp-cache.php hands it to what runs before WordPress draws one. A script of the site's
# own never loads that file, and nothing of it is ever stored, so it gets the Referer from here.
ProxyFCGISetEnvIf "-n req_novary('X-Wpl7-Referer') && %{REQUEST_FILENAME} != '/var/www/html/index.php'" HTTP_REFERER "%{req_novary:X-Wpl7-Referer}"

# Only files named .php, as in the official image: not .phtml, and not image.php.jpg. No slash
# after localhost, or PHP sees SCRIPT_FILENAME=//var/www/html/index.php.
#
# The check for a missing file sets the handler back rather than guarding the SetHandler, because
# an <If> is applied after every other section. Around the SetHandler it would beat a SetHandler
# none in a .htaccess or in the panel's "No PHP in uploads", and PHP would still run there.
<FilesMatch \.php$>
    SetHandler "proxy:unix:/run/wpl7/php-fpm.sock|fcgi://localhost"
    <If "! -f %{REQUEST_FILENAME}">
        SetHandler none
    </If>
</FilesMatch>

# mod_php ran files handed to it by name, whatever they were called, as `AddHandler
# application/x-httpd-php .html` or ForceType in a .htaccess can do. It isn't here, and without this
# Apache would send such a file as it is: PHP source, passwords and all. A 403 says something is
# wrong without saying what the file holds. The .htaccess migration names these lines in its log.
Action application/x-httpd-php /wpl7-php-elsewhere virtual
Action application/x-httpd-php-source /wpl7-php-elsewhere virtual
Action php-script /wpl7-php-elsewhere virtual
<Location /wpl7-php-elsewhere>
    Require all denied
</Location>

# PHP-FPM reads these, and they say a lot about a site. Refused like .htaccess.
<Files ".user.ini">
    Require all denied
</Files>

# Brotli when the visitor takes it, gzip otherwise: BROTLI_COMPRESS comes first in this one list,
# and whichever filter goes second finds the answer already encoded and leaves it alone. Debian's
# deflate.conf is removed in the Dockerfile, or its DEFLATE would come first.
AddOutputFilterByType BROTLI_COMPRESS;DEFLATE \
    text/html text/plain text/xml text/css text/javascript \
    application/javascript application/x-javascript application/ecmascript \
    application/json application/ld+json application/manifest+json \
    application/xml application/xhtml+xml application/rss+xml application/atom+xml \
    application/wasm image/svg+xml \
    font/ttf font/otf application/x-font-ttf application/x-font-otf application/vnd.ms-fontobject

# Cache times for files on disk, picked by file name so an image made by PHP is left alone: the
# name a section sees by then is the script's. A .htaccess's own Header, Expires or ExpiresByType
# runs first, and an answer that says anything about its caching keeps what it says.
<FilesMatch "(?i)\.(?:jpe?g|png|gif|webp|avif|svgz?|ico|bmp|tiff?|heic|heif|jxl|woff2?|ttf|otf|eot|mp3|m4a|aac|ogg|oga|opus|wav|flac|weba|mp4|m4v|webm|ogv|mov|avi|mkv|mpe?g|wmv|flv|3gp)$">
    Header set Cache-Control "max-age=2592000" "expr=-z %{resp:Cache-Control} && -z %{resp:Expires}"
</FilesMatch>
<FilesMatch "(?i)\.(?:css|js|mjs)$">
    Header set Cache-Control "max-age=604800" "expr=-z %{resp:Cache-Control} && -z %{resp:Expires}"
</FilesMatch>
