# The nginx in front of a site's Apache: what never changes between sites. What does change (the
# page cache and its rules) is the site file included at the end, which the panel renders
# (panel/src/services/siteStack.ts). Installed as /etc/nginx/nginx.conf.

user www-data;
worker_processes 1;
pid /run/nginx.pid;
daemon off;
error_log stderr;

# Every request runs the site file's maps over its cookies and query string. A worst-case Cookie
# costs a third as much with this. A query long enough to run out of JIT's stack only fails the
# regex, which falls to the map's default: "skip the cache", which is safe.
pcre_jit on;

# nginx refuses what doesn't fit, with a 500 or a 502, where Apache alone kept a burst waiting. So it
# needs room for one: two connections per request in progress, one to Traefik and one to Apache, and
# a limit on open files of its own, rather than what the container happens to get.
worker_rlimit_nofile 20000;

events {
    worker_connections 10000;
}

http {
    # Traefik logs every request already.
    access_log off;
    server_tokens off;
    # Apache compresses, and a cached page is stored the way it compressed it.
    gzip off;

    # A request body goes to a file here until all of it has arrived, so that a slow sender holds no
    # PHP worker: a pool has only a few. So the file needs a ceiling, which also stops an endless
    # chunked POST. PHP's own post_max_size applies after this, as it always has, and a site whose
    # settings allow more than this gets more from the panel (siteBodyLimitMb).
    client_max_body_size 1g;
    # What a site's visitors can put on the server's disk at once is the ceiling times this many.
    # Only bodies of a megabyte or more count, and those without a length, which could be any size.
    map "$http_transfer_encoding|$content_length" $wpl7_big_body {
        default "";
        "~^[^|]+\|" 1;
        "~\|\d{7,}$" 1;
    }
    limit_conn_zone $wpl7_big_body zone=wpl7_big_bodies:1m;
    limit_conn wpl7_big_bodies 16;
    limit_conn_status 429;

    # Apache takes 8190 bytes in a line and refuses more with a 400 of its own, so a longer buffer
    # gives nothing but regexes more to read: see pcre_jit above.
    large_client_header_buffers 4 16k;
    underscores_in_headers on;
    client_body_timeout 600s;

    # Long enough for what mod_php had no limit on: a backup or a big download through PHP. Apache's
    # Timeout and PHP-FPM's request_terminate_timeout are the same.
    send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Big cookies and long Link or CSP headers are real.
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # Longer than Traefik keeps an idle connection, so Traefik is the side that closes it. The other
    # way round it can send a request into a connection nginx has just closed.
    keepalive_timeout 120s;

    # A redirect nginx makes itself keeps the visitor's scheme and host, not its own view of them.
    absolute_redirect off;

    # A new connection per request, on purpose. Apache's event MPM closes its idle connections as
    # soon as all its workers are busy, which a burst of PHP requests waiting for the pool makes
    # them, and nginx can't resend a POST that met one of those. With keep-alive here, 4 to 18% of
    # POSTs got a 502 at 50 to 400 connections, and none without. Over the loopback it costs tens
    # of microseconds.
    upstream apache {
        server 127.0.0.1:80;
    }

    # Empty, not "close", so PHP sees no Connection header, as it never has behind Traefik. nginx
    # closes the connection itself once the answer is complete.
    map $http_upgrade $wpl7_connection {
        default upgrade;
        "" "";
    }

    # A location with a proxy_set_header of its own replaces all of these, not just the one it sets.
    # The site files repeat them. X-Forwarded-* from Traefik pass unchanged, as all headers do:
    # WordPress works out HTTPS and the visitor's address from them.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection $wpl7_connection;
    proxy_set_header Upgrade $http_upgrade;
    # Apache sees nginx's 127.0.0.1 as its own address, and hands PHP this one instead:
    # apache-site.conf says why.
    proxy_set_header X-Wpl7-Server-Addr $server_addr;
    # Says "this page may be stored" to wp-cache.php. Only the path that stores pages sets it, so a
    # visitor's own copy of the header must not get through anywhere else.
    proxy_set_header X-Wpl7-Cache "";

    # A link wpl7-start and wpl7-reload point at the panel's file
    # (/etc/wpl7-runtime/nginx-site.conf) or, when that is missing or nginx refuses it, at
    # /etc/nginx/wpl7-passthrough.conf.
    include /etc/nginx/wpl7-site.conf;
}
