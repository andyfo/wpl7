; wpl7-adminer (deploy/adminer-image): what Adminer needs, and nothing else within reach.
memory_limit = 256M
; Adminer's import: a gzipped dump counts compressed. The front door takes 32 MB a request
; (panel/src/adminer/frontDoor.ts); bigger dumps go through the panel's own import.
upload_max_filesize = 32M
post_max_size = 33M
max_execution_time = 1800
max_input_vars = 10000
; Sessions and uploads live in /tmp, a tmpfs: gone when the container stops.
session.save_path = /tmp
session.gc_maxlifetime = 43200
upload_tmp_dir = /tmp
sys_temp_dir = /tmp
open_basedir = /srv/adminer:/tmp
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl,putenv,mail
allow_url_fopen = Off
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
